<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ubicación Silencia</title>
</head>
<body>
    <p>Enviando información del equipo Silencia, por favor espera...</p>

    <script>  //Inicio del java script
        // 1. Obtener la palabra desde la URL del QR
        const urlParams = new URLSearchParams(window.location.search);
        const palabra = urlParams.get('palabra') || 'No especificada';

        // Función para enviar los datos a tu formulario/servidor
        function enviarDatos(latitud = null, longitud = null) {
            // Reemplaza esto con la URL de tu formulario, webhook o Google Sheets
            const urlDestino = "https://default19309433eec0484dbde9dd255cdc1e.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2b408322198147828e7e5cfcaeeac997/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OpEA9p3zcvfzcRcvfqxirXlkYtwphjYB6ToVGNUGShQ"; 
            
            const datos = {
            palabra: palabra,
            latitud: latitud,
            longitud: longitud,
            autorizo_gps: latitud !== null
            };

            // Enviar datos en segundo plano
            alert("Palabra recibida: " + palabra);
            console.log(JSON.stringify(datos));
            alert(JSON.stringify(datos));
            
            fetch(urlDestino, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
            .then(async (response) => {

             console.log("Estado:", response.status);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const texto = await response.text();
            console.log("Respuesta:", texto);

            alert("¡Datos enviados con éxito!");
            })
            
            // Arroja el número de erro si lo hay
            .catch((error) => {
                console.error(error);
                alert("Error: " + error.message);
            });
        }

        // 2. Solicitar GPS al usuario de forma nativa
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Si acepta, envía palabra + coordenadas
                    
                    enviarDatos(position.coords.latitude, position.coords.longitude);
                },
                (error) => {
                    // Si rechaza o falla, envía solo la palabra
                    enviarDatos(null, null);
                }
            );
        } else {
            // El navegador no soporta GPS
            enviarDatos(null, null);
        }
    </script>
</body>
</html>
