<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación Silencia</title>
    //Se agrega estilo para cambiar color y texto
    <style>
        /* Estilos para centrar el contenido y dar diseño */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
        }
        
     /* Clase específica para el mensaje azul que resalta */
        .mensaje-resaltado {
            color: #0056b3; /* Un azul llamativo */
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            background-color: #e6f0fa; /* Fondo azul claro para resaltar más */
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        /* Estilos para la imagen */
        .imagen-presentacion {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>  
</head>
    
<body>
    <p>Enviando información del equipo Silencia, por favor espera...</p>

    /* Agregado nuevo en junio 18 */
    <div class="mensaje-resaltado">
        ¡Fresenius Medical Care!
    </div>
    <br>
    <img class="imagen-presentacion" src="https://picsum.photos/400/250" alt="Imagen de ejemplo">


    <script>  //Inicio del java script
        window.onload = function() {
            let nombre = confirm("Un placer nos acompañes, " + ". ¿Tu nombre el Paciente Feliz?");
            if (nombre) {
                    alert("¡Qué alegre! Muchas gracias por tu respuesta. 😊");
                } else {
                    alert("¡Vaya! Seguiremos mejorando para la próxima. 🛠️");
                }
             };


        // 1. Obtener la palabra desde la URL del QR
        const urlParams = new URLSearchParams(window.location.search);
        const palabra = urlParams.get('palabra') || 'No especificada';

        

        // Función para enviar los datos a tu formulario/servidor
        function enviarDatos(latitud = null, longitud = null) {
            // Reemplaza esto con la URL de tu formulario, webhook o Google Sheets
            const urlDestino = "https://default19309433eec0484dbde9dd255cdc1e.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2b408322198147828e7e5cfcaeeac997/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OpEA9p3zcvfzcRcvfqxirXlkYtwphjYB6ToVGNUGShQ"; 
            
            const datos = {
            palabra: palabra,
            latitud: latitud,
            longitud: longitud,
            autorizo_gps: latitud !== null
            };

            // Enviar datos en segundo plano
            alert("Palabra recibida: " + palabra);
            console.log(JSON.stringify(datos));
            alert(JSON.stringify(datos));
            
            fetch(urlDestino, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
            .then(async (response) => {

             console.log("Estado:", response.status);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const texto = await response.text();
            console.log("Respuesta:", texto);

            alert("¡Datos enviados con éxito!");
            })
            
            // Arroja el número de erro si lo hay
            .catch((error) => {
                console.error(error);
                alert("Error: " + error.message);
            });
        }

        // 2. Solicitar GPS al usuario de forma nativa
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Si acepta, envía palabra + coordenadas
                    
                    enviarDatos(position.coords.latitude, position.coords.longitude);
                },
                (error) => {
                    // Si rechaza o falla, envía solo la palabra
                    enviarDatos(null, null);
                }
            );
        } else {
            // El navegador no soporta GPS
            enviarDatos(null, null);
        }
    </script>
</body>
</html>
