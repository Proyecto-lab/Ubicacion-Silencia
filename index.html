<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación Silencia</title>
    
    <style>
        /* Eliminamos los márgenes por defecto del navegador */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        /* Aplicamos la imagen de fondo al contenedor principal */
        body {
            /* REEMPLAZA 'foto.jpg' por el nombre o ruta de tu imagen en GitHub */
            background-image: url('FondoSilencia.jpg'); 
            
            /* Propiedades mágicas para que el fondo se adapte perfectamente */
            background-size: cover;          /* Estira la imagen para cubrir toda la pantalla sin deformarse */
            background-position: center;     /* Centra la imagen vertical y horizontalmente */
            background-repeat: no-repeat;    /* Evita que la imagen se duplique como mosaico */
            background-attachment: fixed;    /* Mantiene el fondo fijo si hay que hacer scroll */
            
            /* Centramos el texto de bienvenida en medio de la pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        
        /* Estilo para que el texto de bienvenida resalte sobre el fondo */
        .mensaje-resaltado {
            font-size: 32px;
            font-weight: bold;
            color: white;                     /* Texto blanco */
            text-align: center;
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.5); /* Fondo negro semitransparente para leer bien el texto */
            border-radius: 10px;              /* Bordes redondeados */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); /* Sombra elegante */
        }   /*para centrar el fondo*/
            
    </style>  
</head>
    
<body>
   
    <div class="mensaje-resaltado">
        Fresenius Medical Care
    </div>
    <br>
    
    <script>  //Inicio del java script
        window.onload = function() {
            let nombre = confirm("Es un placer que nos acompañes, " + ". ¿Es tu nombre Paciente Feliz?");
            if (nombre) {
                    alert("¡Qué alegría! Muchas gracias por tu respuesta. 😊");
                } else {
                    alert("¡Vaya! Seguiremos mejorando para la próxima. 🛠️");
                }
             };


        // 1. Obtener la palabra desde la URL del QR
        const urlParams = new URLSearchParams(window.location.search);
        const palabra = urlParams.get('palabra') || 'No especificada';

        

        // Función para enviar los datos a tu formulario/servidor
        function enviarDatos(latitud = null, longitud = null) {
            // Reemplaza esto con la URL de tu formulario, webhook o Google Sheets
            const urlDestino = "https://default19309433eec0484dbde9dd255cdc1e.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2b408322198147828e7e5cfcaeeac997/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OpEA9p3zcvfzcRcvfqxirXlkYtwphjYB6ToVGNUGShQ"; 
            
            const datos = {
            palabra: palabra,
            latitud: latitud,
            longitud: longitud,
            autorizo_gps: latitud !== null
            };

            // Enviar datos en segundo plano
            console.log(JSON.stringify(datos));
                        
            fetch(urlDestino, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
            .then(async (response) => {

             console.log("Estado:", response.status);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const texto = await response.text();
            console.log("Respuesta:", texto);
            })
            
            // Arroja el número de erro si lo hay
            .catch((error) => {
                console.error(error);
                alert("Error: " + error.message);
            });
        }

        // 2. Solicitar GPS al usuario de forma nativa
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Si acepta, envía palabra + coordenadas
                    
                    enviarDatos(position.coords.latitude, position.coords.longitude);
                },
                (error) => {
                    // Si rechaza o falla, envía solo la palabra
                    enviarDatos(null, null);
                }
            );
        } else {
            // El navegador no soporta GPS
            enviarDatos(null, null);
        }
    </script>
</body>
</html>
