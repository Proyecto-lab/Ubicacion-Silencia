<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación Silencia</title>
    
    <style>
        /* Eliminamos los márgenes por defecto del navegador */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        /* Aplicamos la imagen de fondo al contenedor principal */
        body {
            background-image: url('FondoSilencia.jpg'); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            
            display: flex;
            flex-direction: column; /* Cambiado a columna para organizar el título y el modal */
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        
        /* Estilo para que el texto de bienvenida resalte sobre el fondo */
        .mensaje-resaltado {
            font-size: 32px;
            font-weight: bold;
            color: white;                     
            text-align: center;
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.5); 
            border-radius: 10px;              
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            margin-bottom: 20px;
        }

        /* --- NUEVOS ESTILOS PARA EL CUADRO SÍ/NO --- */
        .modal-pregunta {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 85%;
            z-index: 10;
        }
        .modal-pregunta p {
            font-size: 18px;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .contenedor-botones {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-si {
            background-color: #00539b; /* Azul corporativo aproximado */
            color: white;
        }
        .btn-si:hover {
            background-color: #003d73;
        }
        .btn-no {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-no:hover {
            background-color: #cdcdcd;
        }
    </style>  
</head>
    
<body>
   
    <div class="mensaje-resaltado">
        Fresenius Medical Care
    </div>

    <!-- CUADRO DE PREGUNTA PERSONALIZADO CON BOTONES SÍ / NO -->
    <div class="modal-pregunta" id="cuadroPregunta">
        <p>Es un placer que nos acompañes.<br>¿Es tu nombre <strong>Paciente Feliz</strong>?</p>
        <div class="contenedor-botones">
            <button class="btn btn-si" onclick="responder(true)">Sí</button>
            <button class="btn btn-no" onclick="responder(false)">No</button>
        </div>
    </div>
    
    <script>
        // Función que se ejecuta cuando el usuario presiona SÍ o NO
        function responder(esPacienteFeliz) {
            // Escondemos el cuadro de pregunta para que no estorbe
            document.getElementById('cuadroPregunta').style.display = 'none';

            // Ejecutamos las alertas correspondientes usando un mini retraso para una transición suave
            setTimeout(function() {
                if (esPacienteFeliz) {
                    alert("¡Qué alegría! Muchas gracias por tu respuesta. 😊");
                } else {
                    alert("¡Vaya! Seguiremos mejorando para la próxima. 🛠️");
                }
            }, 100);
        }

        // 1. Obtener la palabra desde la URL del QR
        const urlParams = new URLSearchParams(window.location.search);
        const palabra = urlParams.get('palabra') || 'No especificada';

        // Función para enviar los datos a SharePoint
        function enviarDatos(latitud = null, longitud = null) {
            const urlDestino = "https://default19309433eec0484dbde9dd255cdc1e.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2b408322198147828e7e5cfcaeeac997/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OpEA9p3zcvfzcRcvfqxirXlkYtwphjYB6ToVGNUGShQ"; 
            
            const datos = {
                palabra: palabra,
                latitud: latitud,
                longitud: longitud,
                autorizo_gps: latitud !== null
            };

            console.log(JSON.stringify(datos));
                        
            fetch(urlDestino, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
            .then(async (response) => {
                console.log("Estado:", response.status);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const texto = await response.text();
                console.log("Respuesta:", texto);
            })
            .catch((error) => {
                console.error(error);
                alert("Error: " + error.message);
            });
        }

        // 2. Solicitar GPS al usuario de forma nativa e inmediata al cargar
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    enviarDatos(position.coords.latitude, position.coords.longitude);
                },
                (error) => {
                    enviarDatos(null, null);
                }
            );
        } else {
            enviarDatos(null, null);
        }
    </script>
</body>
</html>
