<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación Silencia</title>
    
    <style>
        /* Eliminamos los márgenes por defecto del navegador */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        /* Aplicamos la imagen de fondo al contenedor principal */
        body {
            background-image: url('FondoSilencia.jpg'); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            
            display: flex;
            flex-direction: column; /* Cambiado a columna para organizar el título y el modal */
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        
        /* Estilo para que el texto de bienvenida resalte sobre el fondo */
        .mensaje-resaltado {
            font-size: 32px;
            font-weight: bold;
            color: white;                     
            text-align: center;
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.5); 
            border-radius: 10px;              
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            margin-bottom: 20px;
        }

        /* --- ESTILOS PARA LOS CUADROS --- */
        .modal-pregunta {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 85%;
            z-index: 10;
        }
        .modal-pregunta p {
            font-size: 18px;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .contenedor-botones {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-si {
            background-color: #00539b; /* Azul corporativo aproximado */
            color: white;
        }
        .btn-si:hover {
            background-color: #003d73;
        }
        .btn-no {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-no:hover {
            background-color: #cdcdcd;
        }

        /* Opciones de selección de rol */
        .contenedor-opciones {
            text-align: left;
            margin-bottom: 20px;
            padding-left: 10px;
        }
        .opcion-rol {
            margin: 12px 0;
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }
        .opcion-rol input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>  
</head>
    
<body>
   
    <div class="mensaje-resaltado">
        Fresenius Medical Care
    </div>

    <!-- CUADRO DE PREGUNTA PRINCIPAL -->
    <div class="modal-pregunta" id="cuadroPregunta">
        <p>Es un placer que nos acompañes.<br>¿Es tu nombre <strong>Paciente Feliz</strong>?</p>
        <div class="contenedor-botones">
            <button class="btn btn-si" onclick="responder(true)">Sí</button>
            <button class="btn btn-no" onclick="responder(false)">No</button>
        </div>
    </div>

    <!-- NUEVO CUADRO: SELECCIÓN DE ROL (OCULTO POR DEFECTO) -->
    <div class="modal-pregunta" id="cuadroRol" style="display: none;">
        <p>Seleccione la opción que más se ajuste a usted:</p>
        <div class="contenedor-opciones">
            <label class="opcion-rol">
                <!-- Se asigna el valor numérico 2 -->
                <input type="radio" name="tipoUsuario" value="2" checked>
                Soy paciente
            </label>
            <label class="opcion-rol">
                <!-- Se asigna el valor numérico 3 -->
                <input type="radio" name="tipoUsuario" value="3">
                Soy familiar/Amigo del paciente
            </label>
            <label class="opcion-rol">
                <!-- Se asigna el valor numérico 4 -->
                <input type="radio" name="tipoUsuario" value="4">
                Soy transportador
            </label>
        </div>
        <div class="contenedor-botones">
            <button class="btn btn-si" onclick="enviarRolSeleccionado()">Enviar</button>
        </div>
    </div>
    
    <script>
        // Variables globales para almacenar temporalmente la ubicación
        let miLatitud = null;
        let miLongitud = null;

        // Función que se ejecuta cuando el usuario presiona SÍ o NO
        function responder(esPacienteFeliz) {
            // Escondemos el cuadro de pregunta principal
            document.getElementById('cuadroPregunta').style.display = 'none';

            if (esPacienteFeliz) {
                // Si es Paciente Feliz, procesamos directamente enviando el número 1
                setTimeout(function() {
                    alert("¡Qué alegría! Muchas gracias por tu respuesta. 😊");
                    enviarDatos(miLatitud, miLongitud, 1);
                }, 100);
            } else {
                // Si NO es Paciente Feliz, mostramos la nueva ventana de selección
                document.getElementById('cuadroRol').style.display = 'block';
            }
        }

        // Función para procesar el botón Enviar del formulario de roles
        function enviarRolSeleccionado() {
            // Buscamos cuál opción de radio fue marcada
            const opciones = document.getElementsByName('tipoUsuario');
            let codigoSeleccionado = 2; // Valor por defecto
            
            for (let i = 0; i < opciones.length; i++) {
                if (opciones[i].checked) {
                    // Convertimos el valor del string a un número entero
                    codigoSeleccionado = parseInt(opciones[i].value, 10);
                    break;
                }
            }
            
            // Ocultamos el cuadro de rol
            document.getElementById('cuadroRol').style.display = 'none';
            
            // Enviamos los datos con el código numérico correspondiente
            alert("Muchas gracias por tu respuesta. Transmitiendo información... 🛠️");
            enviarDatos(miLatitud, miLongitud, codigoSeleccionado);
        }

        // 1. Obtener la palabra desde la URL del QR
        const urlParams = new URLSearchParams(window.location.search);
        const palabra = urlParams.get('palabra') || 'No especificada';

        // Función modificada para enviar los datos a SharePoint incluyendo el código de usuario
        function enviarDatos(latitud = null, longitud = null, codigoUsuario = 0) {
            const urlDestino = "https://default19309433eec0484dbde9dd255cdc1e.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2b408322198147828e7e5cfcaeeac997/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OpEA9p3zcvfzcRcvfqxirXlkYtwphjYB6ToVGNUGShQ"; 
            
            const datos = {
                palabra: palabra,
                latitud: latitud,
                longitud: longitud,
                autorizo_gps: latitud !== null,
                tipo_usuario: codigoUsuario // Enviará un número entero (1, 2, 3 o 4)
            };

            console.log(JSON.stringify(datos));
                        
            fetch(urlDestino, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
            .then(async (response) => {
                console.log("Estado:", response.status);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const texto = await response.text();
                console.log("Respuesta:", texto);
            })
            .catch((error) => {
                console.error(error);
                alert("Error: " + error.message);
            });
        }

        // 2. Solicitar GPS al usuario de forma nativa e inmediata al cargar
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    miLatitud = position.coords.latitude;
                    miLongitud = position.coords.longitude;
                },
                (error) => {
                    miLatitud = null;
                    miLongitud = null;
                }
            );
        }
    </script>
</body>
</html>
